name: ai_business_card_maker
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  font_awesome_flutter: 11.0.0
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  image_cropper: ^8.0.2
  permission_handler: ^11.3.1
  collection: ^1.18.0   # "Upload from Gallery"
  share_plus: ^10.1.2     # native share sheet
  path_provider: ^2.1.4   # temp file location for download/share
  gal: ^2.3.0            # writes bytes straight into the system photo gallery
  get_storage: ^2.1.1     # persist profile data locally
  shared_preferences: ^2.2.3
  flutter_contacts: ^1.1.9+2
  mobile_scanner: ^7.4.2
  camera: ^0.11.2+1
  google_mlkit_text_recognition: ^0.15.0
  google_fonts: ^6.2.1
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  firebase_core: ^4.15.0
  firebase_ai: ^3.15.0
  firebase_app_check: ^0.4.8
  flutter_staggered_grid_view: ^0.7.0
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/bg_templates/
    - assets/icons/
    - assets/icons/social/
    - assets/icons/bottom_nav_icons/
    - assets/images/templates/travel/horizontal/
    - assets/images/templates/travel/vertical/
    - assets/images/templates/spa_care/horizontal/
    - assets/images/templates/spa_care/vertical/
    - assets/images/templates/sports_games/horizontal/
    - assets/images/templates/sports_games/vertical/
    - assets/images/templates/real_estate/horizontal/
    - assets/images/templates/real_estate/vertical/