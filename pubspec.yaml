name: ai_business_card_maker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  font_awesome_flutter: 11.0.0
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  image_cropper: ^8.0.2
  permission_handler: ^11.3.1
  collection: ^1.18.0   # "Upload from Gallery"
  share_plus: ^11.0.0     # native share sheet
  path_provider: ^2.1.4   # temp file location for download/share
  gal: ^2.3.3            # writes bytes straight into the system photo gallery
  get_storage: ^2.1.1     # persist profile data locally
  shared_preferences: ^2.2.3
  flutter_contacts: ^2.6.0
  mobile_scanner: ^7.4.2
  camera: ^0.11.2+1
  google_mlkit_text_recognition: ^0.15.0
  google_fonts: ^6.2.1
  connectivity_plus: ^7.3.2
  http: ^1.6.0
  firebase_core: ^4.15.0
  firebase_app_check: ^0.4.8
  flutter_staggered_grid_view: ^0.7.0
  image: ^4.5.4
  country_code_picker: ^3.4.1
  video_player: ^2.11.1
  url_launcher: ^6.3.1
  intl: ^0.20.2           # paywall: store prices in the store's currency
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  purchases_flutter: ^10.15.2
  in_app_review: ^2.0.12
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  firebase_remote_config: ^6.7.0
  flutter_udid: ^4.1.6
  flutter_local_notifications: ^22.3.2
  internet_connection_checker_plus: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/first_card_template.png
    - assets/images/bg_templates/
    - assets/icons/
    - assets/icons/social/
    - assets/icons/bottom_nav_icons/
    - assets/images/templates/travel/horizontal/
    - assets/images/templates/spa_care/horizontal/
    - assets/images/empty_templates/travel/horizontal/
    - assets/images/empty_templates/spa_care/horizontal/
    - assets/images/empty_templates/first_card/
    - assets/images/template_logos/travel/horizontal/
    - assets/template_json/travel/horizontal/
    - assets/template_json/spa_care/horizontal/
    - assets/template_json/first_card/
    - assets/videos/